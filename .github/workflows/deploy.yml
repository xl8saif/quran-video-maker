name: Build deployment artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download official Tanzil Uthmani text
        run: |
          curl --fail --location --retry 3 --output quran-uthmani.txt \
            'https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=txt-2&agree=true&marks=true&sajdah=true&rub=true&stanween=true'
      - name: Build verified Quran dataset
        run: node scripts/import-tanzil-uthmani.mjs quran-uthmani.txt data/quran/tanzil-uthmani.json
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
