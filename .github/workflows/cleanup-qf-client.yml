name: cleanup qf browser credentials
on:
  push:
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Remove legacy browser credential flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/main.tsx')
          text = path.read_text()
          text = text.replace("import { Play, Pause, Upload, Settings2, Music2, Hand, Languages, RotateCcw, BookOpen, Image as ImageIcon }", "import { Play, Pause, Upload, Music2, Hand, Languages, RotateCcw, BookOpen, Image as ImageIcon }")
          text = text.replace("import { createRecitationController, type RecitationState } from './recitationController'\n", "")
          text = text.replace("import type { ExportPanelOptions } from './exportPanel'\n", "import type { ExportPanelOptions } from './exportPanel'\nimport type { ChapterAudioTiming } from './recitationTiming'\n")
          text = text.replace(",[token,setToken]=React.useState(()=>localStorage.getItem('qvm_qf_token')||''),[clientId,setClientId]=React.useState(()=>localStorage.getItem('qvm_qf_client')||''),[settingsOpen,setSettingsOpen]=React.useState(false)", "")
          text = text.replace(",[recitationRef=React.useRef<ReturnType<typeof createRecitationController>|null>(null)", "")
          text = text.replace("[recitation,setRecitation]=React.useState<RecitationState>({loading:false,error:'',audio:null,activeWordIndex:0})", "[recitation,setRecitation]=React.useState<{loading:boolean;error:string;audio:ChapterAudioTiming|null;activeWordIndex:number;activeVerse?:string}>({loading:false,error:'',audio:null,activeWordIndex:0})")
          text = re.sub(r" React\.useEffect\(\(\)=>\{if\(!token\|\|!clientId\)return;const controller=createRecitationController.*?\n React\.useEffect\(\(\)=>\{const controller=recitationRef\.current.*?\},\[surahNumber,token,clientId\]\)\n", "", text, count=1, flags=re.S)
          text = re.sub(r" React\.useEffect\(\(\)=>\{if\(!recitation\.audio\)return;recitationRef\.current\?\.updateTime\(time\*1000\)\},\[time,recitation\.audio\]\)\n", "", text, count=1)
          text = re.sub(r" const saveApiSettings=\(\)=>\{.*?\}\n", "", text, count=1)
          text = text.replace("<button className=\"ghost\" onClick={()=>setSettingsOpen(v=>!v)}><Settings2 size={16}/> Settings</button>", "")
          text = re.sub(r'\n \{settingsOpen&&<div className=\"settings-pop\">.*?</div>\}', '', text, count=1, flags=re.S)
          path.write_text(text)
          PY
          if grep -nE 'qvm_qf_|createRecitationController|settingsOpen|saveApiSettings|\btoken\b|\bclientId\b|recitationRef' src/main.tsx; then
            echo 'Legacy browser credential references remain.'
            exit 1
          fi
      - name: Verify build
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx
          git diff --cached --quiet || git commit -m 'security: remove legacy browser Quran credentials'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/cleanup-qf-client.yml cleanup-trigger.txt
          git commit -m 'chore: remove temporary credential cleanup workflow'
          git push
