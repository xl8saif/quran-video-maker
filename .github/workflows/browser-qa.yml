name: Browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Quran translations
        run: node scripts/verify-translations.mjs

      - name: Upload translation validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-validation
          path: artifacts/translation-validation.json
          if-no-files-found: error

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Install Playwright
        run: npx playwright@1.62.1 install --with-deps chromium

      - name: Run production browser QA
        run: npx playwright@1.62.1 test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

# Keep this workflow push-triggered so every production change receives the same browser gate.